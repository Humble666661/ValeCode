[project]
name = "valecode"
version = "0.2.0"
description = "A recoverable and observable terminal AI coding assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Humble666661" },
]
keywords = ["ai", "agent", "coding-assistant", "terminal", "tui"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.scripts]
valecode = "valecode.__main__:main"

[project.urls]
Homepage = "https://github.com/Humble666661/ValeCode"
Repository = "https://github.com/Humble666661/ValeCode.git"
Issues = "https://github.com/Humble666661/ValeCode/issues"

[tool.hatch.build.targets.wheel]
packages = ["valecode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
